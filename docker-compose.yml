version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: twitter_clone_db
    environment:
      POSTGRES_USER: twitter_user
      POSTGRES_PASSWORD: twitter_password
      POSTGRES_DB: twitter_clone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
